# Bitbucket Pipeline for React Static Site Deployment to S3

# Environment Variables:
# - AWS_ACCESS_KEY_ID: Pulled from Bitbucket Repository Variables
# - AWS_SECRET_ACCESS_KEY: Pulled from Bitbucket Repository Variables
# - AWS_DEFAULT_REGION: The AWS region where your S3 bucket is located (e.g., us-east-1)
# - S3_BUCKET: The name of your S3 bucket (e.g., buidl-bridge-securitize-production)

image: node:18

pipelines:
  default:
    - step:
        name: Clean Install Dependencies
        caches:
          - node
        script:
          # Clean installation of dependencies
          - rm -rf node_modules package-lock.json
          - npm cache clean --force
          - npm install

    - step:
        name: Build React App
        script:
          # Disable source maps to avoid ENOENT errors
          - export GENERATE_SOURCEMAP=false
          # Run the build command and fall back to npx if necessary
          - npm run build || npx react-scripts build

    - step:
        name: Deploy to S3
        deployment: Production
        script:
          # Sync the build folder with the S3 bucket
          - aws s3 sync build/ s3://$S3_BUCKET/ --delete --acl public-read
          - echo "Deployment to S3 completed successfully."